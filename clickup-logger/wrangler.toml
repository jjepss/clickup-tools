name = "clickup-logger"
main = "src/index.js"
compatibility_date = "2026-10-10"

# Non-secret config. WARN_RATIO = fraction of D1's 5 GB free tier at which /stats returns warn: true.
[vars]
WARN_RATIO = "0.9"

# Fill database_id in after: npx wrangler d1 create clickup-events
[[d1_databases]]
binding = "DB"
database_name = "clickup-events"
database_id = "REPLACE_ME"
